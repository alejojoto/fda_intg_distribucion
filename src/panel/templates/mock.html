<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escenarios de simulación</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 24px auto;
         max-width: 760px; color: #223; background: #f7f8f7; }
  h1 { font-size: 1.3rem; }
  h1 small { font-weight: normal; color: #667; font-size: 0.85rem; }
  fieldset { border: 1px solid #cfd6cf; border-radius: 8px; margin: 14px 0;
             padding: 10px 14px; background: #fff; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: block; margin: 7px 0; }
  label span.ayuda { color: #667; font-size: 0.85rem; }
  input[type=number] { width: 70px; }
  select { max-width: 340px; }
  .botonera { margin: 18px 0; display: flex; gap: 10px; align-items: center; }
  button { padding: 7px 14px; border-radius: 6px; border: 1px solid #9ab09a;
           background: #eef3ee; cursor: pointer; font-size: 0.95rem; }
  button.acento { background: #2e7d32; border-color: #2e7d32; color: #fff; }
  #resultado { margin-left: 6px; color: #2e7d32; }
  #resultado.error { color: #b3261e; }
  a.volver { color: #2e7d32; }
</style>
</head>
<body>
<h1>Escenarios de simulación
  <small>— qué simula el próximo llenado. Se guardan en esta máquina y
  sobreviven reinicios. Sin nada marcado, el llenado simulado sale bien.</small>
</h1>
<a class="volver" href="/">← Volver al panel</a>

<form id="form" onsubmit="guardar(event)">
  <fieldset>
    <legend>Pantalla del programa</legend>
    <label>El programa de facturación está en:
      <select name="estado">
        {% for e in estados %}
        <option value="{{ e }}" {% if escenario.estado == e %}selected{% endif %}>
          {{ {"": "ficha (normal)", "ficha": "ficha (normal)",
              "principal": "pantalla principal, Ficha cerrada",
              "periodo": "ventana de Período", "tasas": "ventana de Tasas",
              "seleccion_serie": "selección de serie",
              "seleccion_empresas": "selección de empresas",
              "menu_empresas": "menú de empresas",
              "actualizacion_empresas": "actualización de empresas",
              "login": "pantalla de inicio de sesión", "cerrada": "cerrado",
              "duplicado": "dos ventanas duplicadas"}[e] }}
        </option>
        {% endfor %}
      </select>
    </label>
    <label><input type="checkbox" name="doc_en_curso"
      {% if escenario.doc_en_curso %}checked{% endif %}>
      Hay un documento en curso en la Ficha (pide confirmación al llenar)</label>
    <label><input type="checkbox" name="ventana_articulo"
      {% if escenario.ventana_articulo %}checked{% endif %}>
      Quedó abierta la ventana de artículo de un llenado anterior</label>
    <label><input type="checkbox" name="ventana_articulo_no_cierra"
      {% if escenario.ventana_articulo_no_cierra %}checked{% endif %}>
      … y no se deja cerrar (el programa pregunta en pantalla)</label>
  </fieldset>

  <fieldset>
    <legend>Fallos durante las líneas <span class="ayuda">(0 = no simular)</span></legend>
    <label>Fallo de artículo en la línea
      <input type="number" name="fallar_en_linea" min="0" value="{{ escenario.fallar_en_linea }}"></label>
    <label>Control que no responde (timeout) en la línea
      <input type="number" name="timeout_en_linea" min="0" value="{{ escenario.timeout_en_linea }}"></label>
    <label>Trancón (pregunta si reiniciar) en la línea
      <input type="number" name="trancon_en_linea" min="0" value="{{ escenario.trancon_en_linea }}">
      <span class="ayuda">la respuesta se da en el aviso del panel</span></label>
    <label>Aviso del programa (popup) en la línea
      <input type="number" name="popup_en_linea" min="0" value="{{ escenario.popup_en_linea }}">
      que se cierra solo a los
      <input type="number" name="popup_segundos" min="0" step="0.5" value="{{ escenario.popup_segundos }}"> s</label>
    <label>Omitir las primeras
      <input type="number" name="omitir_lineas" min="0" value="{{ escenario.omitir_lineas }}">
      líneas <span class="ayuda">(sin precio, código inexistente…)</span></label>
    <label>Segundos por línea
      <input type="number" name="segundos_por_linea" min="0" step="0.1" value="{{ escenario.segundos_por_linea }}">
      <span class="ayuda">(0 = rápido, ~2 s el llenado entero)</span></label>
  </fieldset>

  <fieldset>
    <legend>Encabezado y cierre</legend>
    <label>El campo no se puede completar:
      <select name="fallar_campo">
        <option value="" {% if not escenario.fallar_campo %}selected{% endif %}>no simular</option>
        <option value="cliente" {% if escenario.fallar_campo == "cliente" %}selected{% endif %}>el cliente</option>
        <option value="sucursal" {% if escenario.fallar_campo == "sucursal" %}selected{% endif %}>la sucursal</option>
      </select></label>
    <label><input type="checkbox" name="fallar_cierre"
      {% if escenario.fallar_cierre %}checked{% endif %}>
      Fallo DESPUÉS de llenar (el Aceptar del cierre no responde)</label>
    <label><input type="checkbox" name="respuesta_incompleta"
      {% if escenario.respuesta_incompleta %}checked{% endif %}>
      Respuesta incompleta (no se pueden leer los totales)</label>
    <label><input type="checkbox" name="avisos"
      {% if escenario.avisos %}checked{% endif %}>
      Avisos de discrepancia al final (fecha y tasa)</label>
    <label><input type="checkbox" name="esperar_impresion"
      {% if escenario.esperar_impresion %}checked{% endif %}>
      Cerrar con espera de impresión también en llenados sueltos</label>
    <label>Si hay que cancelar por conflicto con otra máquina, el resultado es:
      <select name="cancelar_conflicto">
        {% for v in veredictos %}
        <option value="{{ v }}" {% if escenario.cancelar_conflicto == v %}selected{% endif %}>{{ v }}</option>
        {% endfor %}
      </select></label>
  </fieldset>

  <div class="botonera">
    <button type="submit" class="acento">Guardar escenario</button>
    <button type="button" onclick="limpiar()">Volver al llenado exitoso</button>
    <span id="resultado"></span>
  </div>
</form>

<script>
const NUMERICOS = ["fallar_en_linea", "timeout_en_linea", "trancon_en_linea",
                   "popup_en_linea", "popup_segundos", "omitir_lineas",
                   "segundos_por_linea"];

async function enviar(datos) {
  const r = document.getElementById("resultado");
  r.textContent = "Guardando…"; r.className = "";
  try {
    const resp = await fetch("/api/mock/escenarios", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(datos)});
    const cuerpo = await resp.json();
    if (!resp.ok) throw new Error(cuerpo.error || resp.status);
    r.textContent = "Guardado. Aplica desde el próximo llenado.";
  } catch (e) {
    r.textContent = "No se pudo guardar: " + e.message; r.className = "error";
  }
}

function guardar(ev) {
  ev.preventDefault();
  const f = ev.target, datos = {};
  for (const el of f.elements) {
    if (!el.name) continue;
    if (el.type === "checkbox") datos[el.name] = el.checked;
    else if (NUMERICOS.includes(el.name)) datos[el.name] = Number(el.value || 0);
    else datos[el.name] = el.value;
  }
  enviar(datos);
}

async function limpiar() {
  await enviar({limpiar: true});
  location.reload();
}
</script>
</body>
</html>
